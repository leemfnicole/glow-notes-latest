<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>glow notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg-0:#2a0610;--bg-1:#4a0a18;--bg-2:#5e0d20;--bg-3:#722030;--bg-4:#8a2c40;
      --line:rgba(255,230,218,.10);--line-s:rgba(255,230,218,.18);
      --ink:#fef2ec;--ink-m:rgba(254,242,236,.66);--ink-f:rgba(254,242,236,.42);
      --cream:#fbe1d6;--cream-2:#f3c8b6;--gold:#f4c95d;--rose:#ff9aa9;--plum:#a35a7a;
      --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-pill:999px;
      --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px -30px rgba(0,0,0,.55);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg-1);color:var(--ink);font-family:'Geist',ui-sans-serif,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--cream);color:var(--bg-1)}

    /* ── Layout shell ───────────────────────────────────────── */
    .shell{display:flex;height:100vh;background:radial-gradient(1400px 900px at 70% 0%,var(--bg-3),var(--bg-1) 65%);overflow:hidden;position:relative}
    .aurora::before{content:'';position:fixed;inset:0;pointer-events:none;
      background-image:radial-gradient(1200px 800px at 18% -10%,rgba(244,201,93,.06),transparent 60%),
        radial-gradient(900px 700px at 110% 30%,rgba(255,154,169,.08),transparent 60%),
        radial-gradient(700px 600px at 50% 120%,rgba(163,90,122,.10),transparent 60%);z-index:0}

    /* ── Sidebar ────────────────────────────────────────────── */
    .sidebar{width:240px;flex-shrink:0;background:rgba(0,0,0,.22);border-right:1px solid var(--line);
      padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:2;position:relative}
    .wordmark-wrap{padding:4px 8px 22px}
    .tagline{padding-left:44px;margin-top:3px;font-family:'Geist Mono',monospace;font-size:9px;
      letter-spacing:.22em;text-transform:uppercase;color:var(--ink-f)}
    .nav-links{display:flex;flex-direction:column;gap:2px}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
      text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-m);
      background:transparent;border:none;cursor:pointer;transition:background .15s,color .15s;
      font-family:'Geist',sans-serif;width:100%;text-align:left}
    .nav-link:hover{color:var(--ink);background:rgba(255,255,255,.04)}
    .nav-link.active{font-weight:600;color:#4a0a18;background:var(--cream)}
    .nav-spacer{flex:1}
    .nav-footer{padding:12px 4px 0;border-top:1px solid var(--line);font-family:'Geist Mono',monospace;
      font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-f)}

    /* ── Main ───────────────────────────────────────────────── */
    .main{flex:1;overflow-y:auto;padding:36px 44px;position:relative;z-index:1}
    .main::-webkit-scrollbar{width:8px}
    .main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px}

    /* ── Cards ──────────────────────────────────────────────── */
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid var(--line-s);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
    .card-flat{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:var(--r-md)}

    /* ── Typography ─────────────────────────────────────────── */
    .serif{font-family:'Fraunces',serif;font-optical-sizing:auto;letter-spacing:-.01em}
    .mono{font-family:'Geist Mono',monospace}
    .eyebrow{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-m)}

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-cream{background:var(--cream);color:#4a0a18;border:1px solid #f9d4c2;border-radius:var(--r-pill);
      font-family:'Geist',sans-serif;font-weight:600;cursor:pointer;
      transition:transform .15s,box-shadow .2s,background .2s;
      box-shadow:0 8px 24px -10px rgba(251,225,214,.45),inset 0 1px 0 #fff;
      display:inline-flex;align-items:center;gap:6px;padding:10px 20px;font-size:13px}
    .btn-cream:hover{background:#ffeadd;transform:translateY(-1px)}
    .btn-ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line-s);
      border-radius:var(--r-pill);font-family:'Geist',sans-serif;font-weight:500;cursor:pointer;
      transition:background .15s;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:13px}
    .btn-ghost:hover{background:rgba(255,255,255,.08)}

    /* ── Tabs ───────────────────────────────────────────────── */
    .tabs{display:inline-flex;background:rgba(0,0,0,.22);border:1px solid var(--line);
      border-radius:var(--r-pill);padding:4px;gap:2px}
    .tab{padding:7px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:500;
      color:var(--ink-m);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:background .15s,color .15s;border:none;background:transparent;font-family:'Geist',sans-serif}
    .tab.active{background:var(--cream);color:#4a0a18;font-weight:600}

    /* ── Step rows ──────────────────────────────────────────── */
    .step-row{display:flex;align-items:center;gap:14px;padding:14px 18px;
      border:1px solid var(--line-s);border-radius:18px;background:rgba(255,255,255,.03);transition:background .15s}
    .step-row.done{opacity:.55}
    .step-row.done .step-name{text-decoration:line-through}
    .step-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-s);
      display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s;
      background:transparent}
    .step-check.checked{background:var(--cream);border-color:var(--cream);color:#4a0a18}

    /* ── Product cards ──────────────────────────────────────── */
    .product-card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid var(--line-s);border-radius:18px;padding:14px;
      display:flex;flex-direction:column;gap:12px;cursor:default;transition:transform .15s,border-color .15s}
    .product-card:hover{transform:translateY(-2px);border-color:rgba(255,230,218,.28)}
    .product-swatch{aspect-ratio:1;border-radius:14px;position:relative;
      border:1px solid var(--line);overflow:hidden;display:flex;align-items:flex-end}

    /* ── Day circles ────────────────────────────────────────── */
    .day-circle{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      border:1px solid var(--line-s);color:var(--ink-m);font-size:12px;transition:all .2s}
    .day-circle.done{background:var(--cream);color:#4a0a18;border-color:var(--cream)}
    .day-circle.today{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(244,201,93,.12)}

    /* ── Chip ───────────────────────────────────────────────── */
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
      background:rgba(255,255,255,.04);border:1px solid var(--line-s);border-radius:999px;
      color:var(--ink);font-size:12px;cursor:pointer;transition:background .15s;font-family:'Geist',sans-serif;border:none}
    .chip:hover{background:rgba(255,255,255,.08)}
    .chip.active{background:var(--cream);color:#4a0a18}

    /* ── Chat ───────────────────────────────────────────────── */
    .chat-root{display:flex;flex-direction:column;height:100%;max-width:880px;overflow:hidden}
    .chat-header{display:flex;align-items:center;gap:14px;padding:20px 44px 18px;
      border-bottom:1px solid var(--line);flex-shrink:0}
    .chat-messages{flex:1;overflow-y:auto;padding:24px 44px;display:flex;flex-direction:column;gap:14px}
    .chat-footer{padding:14px 44px 20px;border-top:1px solid var(--line);flex-shrink:0}
    .chat-form{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);
      border:1px solid var(--line-s);border-radius:999px;padding:6px 6px 6px 18px}
    .chat-input{flex:1;background:transparent;border:none;color:var(--ink);font-size:14px;
      font-family:'Geist',sans-serif;outline:none;padding:6px 0}
    .chat-input::placeholder{color:var(--ink-f)}
    .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
      color:var(--ink-f);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s}
    .send-btn.active{background:var(--cream);color:#4a0a18}
    .upload-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;
      color:var(--ink-f);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:color .15s}
    .upload-btn:hover{color:var(--ink-m)}
    .pending-images{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 4px}
    .pending-img-wrap{position:relative}
    .pending-img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line-s);display:block}
    .pending-img-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
      background:var(--bg-2);border:1px solid var(--line-s);color:var(--ink);
      display:grid;place-items:center;cursor:pointer;font-size:10px;line-height:1}
    .bubble-img{width:180px;height:180px;object-fit:cover;border-radius:12px;display:block;margin-bottom:6px}
    .bubble-img-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .bubble-row{display:flex;align-items:flex-end;gap:10px}
    .bubble-row.user{flex-direction:row-reverse}
    .bubble{border-radius:18px;padding:13px 17px;line-height:1.55;border:1px solid var(--line-s);font-size:14px}
    .bubble.ai{background:rgba(255,255,255,.04);border-radius:18px 18px 18px 4px}
    .bubble.user{background:var(--cream);color:#4a0a18;border-radius:18px 18px 4px 18px;border-color:var(--cream)}
    .bubble-avatar{width:28px;height:28px;border-radius:50%;background:rgba(244,201,93,.12);
      display:grid;place-items:center;font-size:13px;flex-shrink:0}

    /* ── Input ──────────────────────────────────────────────── */
    .gn-input{width:100%;background:rgba(0,0,0,.20);border:1px solid var(--line-s);border-radius:12px;
      padding:12px 14px;color:var(--ink);font-family:'Geist',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
    .gn-input::placeholder{color:var(--ink-f)}
    .gn-input:focus{border-color:var(--cream-2)}
    textarea.gn-input{resize:vertical;min-height:80px}

    /* ── Fade in ────────────────────────────────────────────── */
    .fade-in{animation:fadeIn .35s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* ── Mobile top bar ─────────────────────────────────────── */
    .mobile-bar{display:none;position:fixed;top:0;left:0;right:0;height:56px;
      background:rgba(42,6,16,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
      align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
    .hamburger{background:none;border:none;color:var(--ink);cursor:pointer;padding:6px;display:flex;align-items:center}
    .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:rgba(42,6,16,.97);
      backdrop-filter:blur(24px);border-right:1px solid var(--line);padding:22px 14px;
      display:flex;flex-direction:column;gap:4px;z-index:300;transform:translateX(-100%);
      transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .drawer.open{transform:translateX(0)}
    .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 22px}
    .close-btn{background:none;border:none;color:var(--ink-m);cursor:pointer;padding:4px}

    /* ── Wishlist badge ─────────────────────────────────────── */
    .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;
      font-weight:600;letter-spacing:.02em}
    .badge-want{background:rgba(244,201,93,.18);color:var(--gold)}
    .badge-bought{background:rgba(125,210,140,.18);color:#7dd28c}

    /* ── Rating stars ───────────────────────────────────────── */
    .stars{display:flex;gap:3px;color:var(--gold);font-size:13px}

    /* ── Responsive ─────────────────────────────────────────── */
    @media(max-width:768px){
      .sidebar{display:none}
      .mobile-bar{display:flex}
      .main{padding:72px 16px 24px}
      .page-title{font-size:26px!important}
      .grid-top{grid-template-columns:1fr!important}
      .grid-quick{grid-template-columns:1fr 1fr!important}
      .grid-stash{grid-template-columns:repeat(2,1fr)!important}
      .chat-header{padding:14px 16px 12px!important}
      .chat-messages{padding:14px!important}
      .chat-footer{padding:10px 14px 14px!important}
      .main.is-chat{padding:0!important}
      .chat-root{height:calc(100vh - 56px);margin-top:56px}
    }
    @media(max-width:480px){
      .grid-stash{grid-template-columns:1fr!important}
      .grid-quick{grid-template-columns:1fr!important}
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Data — starts empty, user builds their own ───────────── */
const MOCK_PRODUCTS = [];
const MOCK_ROUTINE = [
  { id:1, name:'Gentle Cleanser', desc:'Double cleanse — oil first, then foam', duration:'2 min' },
  { id:2, name:'Toner / Essence', desc:'Pat in 3 layers for deep hydration', duration:'1 min' },
  { id:3, name:'Vitamin C Serum', desc:'Morning only — brightens and protects', duration:'30 sec' },
  { id:4, name:'Eye Cream', desc:'Tap gently around the orbital bone', duration:'30 sec' },
  { id:5, name:'Moisturiser', desc:'Lock in all the layers below', duration:'1 min' },
  { id:6, name:'SPF 50+', desc:'Last step, every single morning', duration:'1 min' },
];
const MOCK_WISHLIST = [];
const SKIN_TYPES = ['Normal','Oily','Dry','Combination','Sensitive'];
const DAYS = ['M','T','W','T','F','S','S'];

/* ── Wordmark ─────────────────────────────────────────────── */
function Wordmark() {
  return (
    <svg width="140" height="26" viewBox="0 0 224 40" fill="none">
      <defs>
        <radialGradient id="wm-pearl" cx="0.4" cy="0.35" r="0.7">
          <stop offset="0%" stopColor="#fff4ef"/>
          <stop offset="50%" stopColor="#fbd9d3"/>
          <stop offset="100%" stopColor="#c47a82"/>
        </radialGradient>
      </defs>
      <path d="M 5 21 C 4 13, 11 6, 21 5 C 30 5, 36 11, 36 20 C 36 28, 29 35, 20 35 C 11 35, 6 29, 5 21 Z"
        fill="none" stroke="rgba(255,235,224,0.45)" strokeWidth="0.9" strokeLinecap="round"/>
      <ellipse cx="20" cy="20" rx="11" ry="10" fill="url(#wm-pearl)"/>
      <path d="M14 15 Q 17 10 24 11" stroke="#fff8f4" strokeWidth="1.2" strokeLinecap="round" fill="none" opacity="0.85"/>
      <text x="46" y="27" fontFamily="Fraunces, serif" fontWeight="600" fontSize="22" letterSpacing="-0.5" fill="currentColor">glow</text>
      <text x="99" y="27" fontFamily="Fraunces, serif" fontStyle="italic" fontWeight="500" fontSize="22" letterSpacing="-0.5" fill="currentColor" opacity="0.82">notes</text>
    </svg>
  );
}

/* ── Icons ─────────────────────────────────────────────────── */
const I = ({ d, size=18, sw=1.6 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {d.map((p,i) => p.startsWith('C') ? <circle key={i} cx={p.split(',')[1]} cy={p.split(',')[2]} r={p.split(',')[3]}/> : <path key={i} d={p}/>)}
  </svg>
);
const HomeIcon     = ({active}) => <I d={["M3 11.5 12 4l9 7.5","M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"]} sw={active?2:1.6}/>;
const ChatIcon     = ({active}) => <I d={["M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12Z"]} sw={active?2:1.6}/>;
const RoutinesIcon = ({active}) => <I d={["M8 6h12","M8 12h12","M8 18h12","C,4,6,1.5","C,4,12,1.5","C,4,18,1.5"]} sw={active?2:1.6}/>;
const StashIcon    = ({active}) => <I d={["M3 7.5 12 3l9 4.5v9L12 21 3 16.5z","m3 7.5 9 4.5 9-4.5","M12 12v9"]} sw={active?2:1.6}/>;
const WishlistIcon = ({active}) => <I d={["M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"]} sw={active?2:1.6}/>;
const ProfileIcon  = ({active}) => <I d={["C,12,8,4","M4 21a8 8 0 0 1 16 0"]} sw={active?2:1.6}/>;
const CheckIcon    = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M20 6 9 17l-5-5"/></svg>;
const SendIcon     = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>;
const SparkleIcon  = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" strokeWidth="1.5" strokeLinecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>;
const PlusIcon     = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;

const NAV = [
  { id:'home',     label:'Home',      Icon:HomeIcon },
  { id:'chat',     label:'Concierge', Icon:ChatIcon },
  { id:'routines', label:'Routines',  Icon:RoutinesIcon },
  { id:'stash',    label:'Stash',     Icon:StashIcon },
  { id:'wishlist', label:'Wishlist',  Icon:WishlistIcon },
  { id:'profile',  label:'Profile',   Icon:ProfileIcon },
];

/* ── Nav links shared ─────────────────────────────────────── */
function NavLinks({ page, setPage, onClick }) {
  return (
    <div className="nav-links">
      {NAV.map(({ id, label, Icon }) => {
        const active = page === id;
        return (
          <button key={id} className={`nav-link ${active?'active':''}`}
            onClick={() => { setPage(id); onClick?.(); }}>
            <Icon active={active} />
            {label}
          </button>
        );
      })}
    </div>
  );
}

/* ── Shell / layout ───────────────────────────────────────── */
function Shell({ page, setPage, children }) {
  const [drawerOpen, setDrawerOpen] = useState(false);
  return (
    <div className="shell aurora">
      {/* Desktop sidebar */}
      <nav className="sidebar">
        <div className="wordmark-wrap">
          <Wordmark />
          <div className="tagline">SKIN CONCIERGE</div>
        </div>
        <NavLinks page={page} setPage={setPage} />
        <div className="nav-spacer" />
        <div className="nav-footer">POWERED BY CLAUDE</div>
      </nav>

      {/* Mobile top bar */}
      <div className="mobile-bar">
        <Wordmark />
        <button className="hamburger" onClick={() => setDrawerOpen(true)} aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>
          </svg>
        </button>
      </div>

      {/* Drawer overlay */}
      {drawerOpen && <div className="drawer-overlay" style={{display:'block'}} onClick={() => setDrawerOpen(false)} />}

      {/* Drawer */}
      <div className={`drawer ${drawerOpen?'open':''}`}>
        <div className="drawer-header">
          <Wordmark />
          <button className="close-btn" onClick={() => setDrawerOpen(false)} aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <NavLinks page={page} setPage={setPage} onClick={() => setDrawerOpen(false)} />
        <div className="nav-spacer" />
        <div className="nav-footer">POWERED BY CLAUDE</div>
      </div>

      {/* Main */}
      <main className={`main ${page==='chat'?'is-chat':''}`}>
        {children}
      </main>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   HOME PAGE
══════════════════════════════════════════════════════════════ */
function MetricBar({ label, value, color }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8 }}>

function GlowIndexCard() {

      <div style={{ position:'relative', width:120, height:120, flexShrink:0 }}>

          <circle cx="60" cy="60" r={r} stroke="var(--cream)" strokeWidth="5" fill="none"
            strokeDasharray={C} strokeDashoffset={off} strokeLinecap="round" transform="rotate(-90 60 60)"
            style={{ transition:'stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)' }}/>
        </svg>
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
          <div className="serif" style={{ fontSize:34, fontWeight:600, lineHeight:1 }}>{score}</div>

      <div style={{ flex:1, minWidth:0 }}>

function StreakCard() {
  const streakCount = 4;
  const streakDays  = [true, true, true, true, false, false, false];
  const todayIdx = new Date().getDay(); // 0=Sun
  const dayOrder = [1,2,3,4,5,6,0];
  return (
    <div className="card" style={{ padding:22 }}>
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:16 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom:4 }}>STREAK</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
            <span className="serif" style={{ fontSize:38, fontWeight:600, lineHeight:1 }}>{streakCount}</span>
            <span style={{ fontSize:13, color:'var(--ink-m)' }}>day{streakCount!==1?'s':''}</span>
          </div>
        </div>
        <div style={{ fontSize:28 }}>🔥</div>
      </div>
      <div style={{ display:'flex', gap:6 }}>
        {dayOrder.map((dayOfWeek, i) => {
          const diff = (todayIdx - dayOfWeek + 7) % 7;
          const done = streakDays[diff] ?? false;
          const isToday = dayOfWeek === todayIdx;
          return (
            <div key={i} className={`day-circle ${done?'done':''} ${isToday&&!done?'today':''}`}>
              {DAYS[i]}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop:14, fontSize:12, color:'var(--ink-m)' }}>
        {streakCount > 0 ? `${streakCount} days in a row — keep it going!` : 'Start your streak today.'}
      </div>
    </div>
  );
}

   CHAT PAGE

const AI_PHOTO_RESPONSES = [
  "I can see your skin in the photo! It looks like you have some dryness around the T-zone. I'd suggest adding a hydrating toner like COSRX Full Fit Propolis Synergy Toner before your moisturiser. Are you currently using any actives in your routine?",
  "Thanks for sharing that! From what I can see, your skin barrier looks a little compromised — there's some mild redness around the cheeks. I'd ease off any exfoliants for a week and focus on ceramide-based products. How often are you exfoliating currently?",
  "Great photo! Your skin texture is looking pretty smooth overall. I notice a little congestion around the nose — that's usually excess sebum. A BHA like salicylic acid 2–3x a week could really help with that. Are you cleansing in the morning?",
  "I can see this product clearly — that looks like a vitamin C serum! Vitamin C is fantastic for brightening and protection, but make sure you're storing it away from light and heat as it oxidises quickly. What's your current morning routine like?",
];

function ChatPage() {
  const [messages, setMessages] = useState([
    { role:'ai', text:"Hi! I'm your skin concierge. Ask me anything about your routine, ingredients, or skin concerns — or upload a photo of your skin or a product for me to analyse ✨" }
  ]);
  const [input, setInput] = useState('');
  const [pendingImages, setPendingImages] = useState([]); // [{url, file}]
  const messagesEndRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const handleFileChange = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        setPendingImages(imgs => [...imgs, { url: ev.target.result, name: file.name }]);
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

  const removeImage = (idx) => setPendingImages(imgs => imgs.filter((_, i) => i !== idx));

  const canSend = input.trim() || pendingImages.length > 0;

  const send = () => {
    if (!canSend) return;
    const userMsg = input.trim();
    const imgs = [...pendingImages];
    setInput('');
    setPendingImages([]);
    setMessages(m => [...m, { role:'user', text:userMsg, images:imgs }]);

    // AI response — photo-aware
    const hasPhoto = imgs.length > 0;
    setTimeout(() => {
      const reply = hasPhoto
        ? AI_PHOTO_RESPONSES[Math.floor(Math.random() * AI_PHOTO_RESPONSES.length)]
        : "I'd love to help with that! The full AI concierge will be live once the app is deployed. Feel free to upload a photo of your skin or a product and I'll give you my best analysis ✨";
      setMessages(m => [...m, { role:'ai', text:reply }]);
    }, hasPhoto ? 1200 : 700);
  };

  return (
    <div className="chat-root">
      <div className="chat-header">
        <div style={{ width:44, height:44, borderRadius:'50%', background:'rgba(244,201,93,.12)', border:'1px solid rgba(244,201,93,.28)', display:'grid', placeItems:'center', fontSize:20, flexShrink:0 }}>✨</div>
        <div>
          <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Skin Concierge</div>
          <div style={{ fontSize:12, color:'var(--ink-m)', marginTop:1 }}>Powered by Claude · Your personal skin advisor</div>
        </div>
        <div style={{ marginLeft:'auto', fontFamily:"'Geist Mono',monospace", fontSize:11, color:'var(--ink-f)', display:'flex', alignItems:'center', gap:6 }}>
          <div style={{ width:6, height:6, borderRadius:'50%', background:'#7ad888' }} /> ONLINE
        </div>
      </div>

      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i} className={`bubble-row ${m.role}`}>
            {m.role === 'ai' && <div className="bubble-avatar">✨</div>}
            <div className={`bubble ${m.role}`} style={{ maxWidth:'72%' }}>
              {m.images && m.images.length > 0 && (
                <div className="bubble-img-grid">
                  {m.images.map((img, j) => (
                    <img key={j} src={img.url} className="bubble-img" alt="uploaded" />
                  ))}
                </div>
              )}
              {m.text && <div>{m.text}</div>}
            </div>
          </div>
        ))}
        <div ref={messagesEndRef} />
      </div>

      <div className="chat-footer">
        {/* Pending image previews */}
        {pendingImages.length > 0 && (
          <div className="pending-images" style={{ marginBottom:8 }}>
            {pendingImages.map((img, i) => (
              <div key={i} className="pending-img-wrap">
                <img src={img.url} className="pending-img" alt="pending" />
                <button className="pending-img-remove" onClick={() => removeImage(i)}>✕</button>
              </div>
            ))}
          </div>
        )}

        <div className="chat-form">
          {/* Hidden file input */}
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            multiple
            style={{ display:'none' }}
            onChange={handleFileChange}
          />
          {/* Upload button */}
          <button
            className="upload-btn"
            onClick={() => fileInputRef.current?.click()}
            title="Upload a photo for AI analysis"
          >
            <CameraIcon />
          </button>

          <input className="chat-input" placeholder="Ask about your skin, routine, or products…"
            value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), send())} />
          <button className={`send-btn ${canSend?'active':''}`} onClick={send}><SendIcon /></button>
        </div>
        <div style={{ fontFamily:"'Geist Mono',monospace", fontSize:9, letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--ink-f)', textAlign:'center', marginTop:8 }}>
          POWERED BY CLAUDE
        </div>
      </div>
    </div>
  );
}

      {doneCount === MOCK_ROUTINE.length && (

          <div style={{ fontSize:28, marginBottom:8 }}>🎉</div>

          <div style={{ fontSize:13, color:'var(--ink-m)', marginTop:4 }}>Your skin will thank you.</div>
        </div>
      )}

  );

          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {data.map(item => (
              <div key={item.id} className="card-flat" style={{ padding:'14px 18px', display:'flex', alignItems:'center', gap:14 }}>
                <button onClick={() => toggleBought(item.id)}
                  className={`step-check ${item.status==='bought'?'checked':''}`}>
                  {item.status==='bought' && <CheckIcon />}
                </button>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:14, textDecoration:item.status==='bought'?'line-through':'none', color:item.status==='bought'?'var(--ink-m)':'var(--ink)' }}>{item.name}</div>
                  {item.brand && <div style={{ fontSize:12, color:'var(--ink-m)', marginTop:1 }}>{item.brand}</div>}
                  {item.notes && <div style={{ fontSize:12, color:'var(--ink-f)', marginTop:2 }}>{item.notes}</div>}
                </div>
                <span className={`badge ${item.status==='want'?'badge-want':'badge-bought'}`}>
                  {item.status==='want'?'Want':'Bought'}
                </span>
                <button onClick={() => del(item.id)} style={{ background:'none', border:'none', color:'var(--ink-f)', cursor:'pointer', fontSize:16, padding:4 }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      ))}

      {items.length === 0 && (
        <div className="card" style={{ textAlign:'center', padding:'60px 24px' }}>
          <div style={{ fontSize:13, color:'var(--ink-f)' }}>Your wishlist is empty. Add something to try!</div>
        </div>
      )}

      {showModal && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.65)', backdropFilter:'blur(8px)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:500, padding:24 }}
          onClick={e => e.target === e.currentTarget && setShowModal(false)}>
          <div style={{
            width:'100%', maxWidth:400, padding:28,
            background:'linear-gradient(160deg, #3d0a16 0%, #2e0810 100%)',
            border:'1px solid var(--line-s)', borderRadius:24,
            boxShadow:'0 32px 80px -16px rgba(0,0,0,.8)',
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
              <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Add to Wishlist</div>
              <button onClick={() => setShowModal(false)} style={{ background:'rgba(255,255,255,.07)', border:'1px solid var(--line)', borderRadius:'50%', width:30, height:30, display:'grid', placeItems:'center', color:'var(--ink-m)', cursor:'pointer', fontSize:14 }}>✕</button>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              <input className="gn-input" placeholder="Product name *" value={form.name} onChange={e => setForm(f => ({...f, name:e.target.value}))} />
              <input className="gn-input" placeholder="Brand" value={form.brand} onChange={e => setForm(f => ({...f, brand:e.target.value}))} />
              <input className="gn-input" placeholder="Notes (optional)" value={form.notes} onChange={e => setForm(f => ({...f, notes:e.target.value}))} />
            </div>
            <div style={{ display:'flex', gap:10, marginTop:22 }}>
              <button className="btn-ghost" style={{ flex:1, justifyContent:'center' }} onClick={() => setShowModal(false)}>Cancel</button>
              <button className="btn-cream" style={{ flex:1, justifyContent:'center' }} onClick={add}>Add Item</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PROFILE PAGE
══════════════════════════════════════════════════════════════ */
function ProfilePage() {
  const [skinType, setSkinType] = useState('Combination');
  const [concerns, setConcerns] = useState(['Hydration', 'Redness']);
  const CONCERNS = ['Hydration','Acne','Redness','Anti-aging','Brightening','Sensitivity','Oiliness','Texture'];

  const toggleConcern = (c) => setConcerns(cs => cs.includes(c) ? cs.filter(x => x!==c) : [...cs, c]);

  return (
    <div className="fade-in" style={{ maxWidth:640 }}>
      <div style={{ marginBottom:28 }}>
        <h1 className="serif page-title" style={{ fontSize:38, fontWeight:600, letterSpacing:'-0.02em' }}>Profile</h1>
      </div>

      {/* Avatar */}
      <div className="card" style={{ padding:24, display:'flex', alignItems:'center', gap:18, marginBottom:18 }}>
        <div style={{ width:68, height:68, borderRadius:'50%', background:'linear-gradient(135deg, var(--bg-3), var(--plum))', display:'grid', placeItems:'center', fontSize:28, flexShrink:0, border:'2px solid var(--line-s)' }}>
          🌸
        </div>
        <div>
          <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Nicole</div>
          <div style={{ fontSize:13, color:'var(--ink-m)', marginTop:2 }}>nicole@example.com</div>
        </div>
      </div>

      {/* Skin type */}
      <div className="card" style={{ padding:22, marginBottom:18 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>SKIN TYPE</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
          {SKIN_TYPES.map(t => (
            <button key={t} className={`chip ${skinType===t?'active':''}`} onClick={() => setSkinType(t)}
              style={{ border: skinType===t ? 'none' : '1px solid var(--line-s)', cursor:'pointer' }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      {/* Concerns */}
      <div className="card" style={{ padding:22, marginBottom:18 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>SKIN CONCERNS</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
          {CONCERNS.map(c => (
            <button key={c} className={`chip ${concerns.includes(c)?'active':''}`} onClick={() => toggleConcern(c)}
              style={{ border: concerns.includes(c) ? 'none' : '1px solid var(--line-s)', cursor:'pointer' }}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {/* Stats */}
      <div className="card" style={{ padding:22 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>YOUR STATS</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
          {[
            { label:'Products', value: 0 },
            { label:'Wishlist',  value: 0 },
            { label:'Day Streak', value: '0 🌱' },
          ].map(({ label, value }) => (
            <div key={label} style={{ textAlign:'center', padding:'14px 8px', background:'rgba(255,255,255,.03)', borderRadius:12, border:'1px solid var(--line)' }}>
              <div className="serif" style={{ fontSize:26, fontWeight:600, lineHeight:1 }}>{value}</div>
              <div style={{ fontSize:11, color:'var(--ink-m)', marginTop:4 }}>{label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState('home');

  const content = {
    home:     <HomePage setPage={setPage} />,
    chat:     <ChatPage />,
    routines: <RoutinesPage />,
    stash:    <StashPage />,
    wishlist: <WishlistPage />,
    profile:  <ProfilePage />,
  };

  return (
    <Shell page={page} setPage={setPage}>
      {content[page]}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
