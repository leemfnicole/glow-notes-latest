<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>glow notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg-0:#2a0610;--bg-1:#4a0a18;--bg-2:#5e0d20;--bg-3:#722030;--bg-4:#8a2c40;
      --line:rgba(255,230,218,.10);--line-s:rgba(255,230,218,.18);
      --ink:#fef2ec;--ink-m:rgba(254,242,236,.66);--ink-f:rgba(254,242,236,.42);
      --cream:#fbe1d6;--cream-2:#f3c8b6;--gold:#f4c95d;--rose:#ff9aa9;--plum:#a35a7a;
      --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-pill:999px;
      --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px -30px rgba(0,0,0,.55);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg-1);color:var(--ink);font-family:'Geist',ui-sans-serif,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--cream);color:var(--bg-1)}

    /* ── Layout shell ───────────────────────────────────────── */
    .shell{display:flex;height:100vh;background:radial-gradient(1400px 900px at 70% 0%,var(--bg-3),var(--bg-1) 65%);overflow:hidden;position:relative}
    .aurora::before{content:'';position:fixed;inset:0;pointer-events:none;
      background-image:radial-gradient(1200px 800px at 18% -10%,rgba(244,201,93,.06),transparent 60%),
        radial-gradient(900px 700px at 110% 30%,rgba(255,154,169,.08),transparent 60%),
        radial-gradient(700px 600px at 50% 120%,rgba(163,90,122,.10),transparent 60%);z-index:0}

    /* ── Sidebar ────────────────────────────────────────────── */
    .sidebar{width:240px;flex-shrink:0;background:rgba(0,0,0,.22);border-right:1px solid var(--line);
      padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:2;position:relative}
    .wordmark-wrap{padding:4px 8px 22px}
    .tagline{padding-left:44px;margin-top:3px;font-family:'Geist Mono',monospace;font-size:9px;
      letter-spacing:.22em;text-transform:uppercase;color:var(--ink-f)}
    .nav-links{display:flex;flex-direction:column;gap:2px}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
      text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-m);
      background:transparent;border:none;cursor:pointer;transition:background .15s,color .15s;
      font-family:'Geist',sans-serif;width:100%;text-align:left}
    .nav-link:hover{color:var(--ink);background:rgba(255,255,255,.04)}
    .nav-link.active{font-weight:600;color:#4a0a18;background:var(--cream)}
    .nav-spacer{flex:1}
    .nav-footer{padding:12px 4px 0;border-top:1px solid var(--line);font-family:'Geist Mono',monospace;
      font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-f)}

    /* ── Main ───────────────────────────────────────────────── */
    .main{flex:1;overflow-y:auto;padding:36px 44px;position:relative;z-index:1}
    .main::-webkit-scrollbar{width:8px}
    .main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px}

    /* ── Cards ──────────────────────────────────────────────── */
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid var(--line-s);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
    .card-flat{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:var(--r-md)}

    /* ── Typography ─────────────────────────────────────────── */
    .serif{font-family:'Fraunces',serif;font-optical-sizing:auto;letter-spacing:-.01em}
    .mono{font-family:'Geist Mono',monospace}
    .eyebrow{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-m)}

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-cream{background:var(--cream);color:#4a0a18;border:1px solid #f9d4c2;border-radius:var(--r-pill);
      font-family:'Geist',sans-serif;font-weight:600;cursor:pointer;
      transition:transform .15s,box-shadow .2s,background .2s;
      box-shadow:0 8px 24px -10px rgba(251,225,214,.45),inset 0 1px 0 #fff;
      display:inline-flex;align-items:center;gap:6px;padding:10px 20px;font-size:13px}
    .btn-cream:hover{background:#ffeadd;transform:translateY(-1px)}
    .btn-ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line-s);
      border-radius:var(--r-pill);font-family:'Geist',sans-serif;font-weight:500;cursor:pointer;
      transition:background .15s;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:13px}
    .btn-ghost:hover{background:rgba(255,255,255,.08)}

    /* ── Tabs ───────────────────────────────────────────────── */
    .tabs{display:inline-flex;background:rgba(0,0,0,.22);border:1px solid var(--line);
      border-radius:var(--r-pill);padding:4px;gap:2px}
    .tab{padding:7px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:500;
      color:var(--ink-m);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:background .15s,color .15s;border:none;background:transparent;font-family:'Geist',sans-serif}
    .tab.active{background:var(--cream);color:#4a0a18;font-weight:600}

    /* ── Step rows ──────────────────────────────────────────── */
    .step-row{display:flex;align-items:center;gap:14px;padding:14px 18px;
      border:1px solid var(--line-s);border-radius:18px;background:rgba(255,255,255,.03);transition:background .15s}
    .step-row.done{opacity:.55}
    .step-row.done .step-name{text-decoration:line-through}
    .step-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-s);
      display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s;
      background:transparent}
    .step-check.checked{background:var(--cream);border-color:var(--cream);color:#4a0a18}

    /* ── Product cards ──────────────────────────────────────── */
    .product-card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid var(--line-s);border-radius:18px;padding:14px;
      display:flex;flex-direction:column;gap:12px;cursor:default;transition:transform .15s,border-color .15s}
    .product-card:hover{transform:translateY(-2px);border-color:rgba(255,230,218,.28)}
    .product-swatch{aspect-ratio:1;border-radius:14px;position:relative;
      border:1px solid var(--line);overflow:hidden;display:flex;align-items:flex-end}

    /* ── Day circles ────────────────────────────────────────── */
    .day-circle{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      border:1px solid var(--line-s);color:var(--ink-m);font-size:12px;transition:all .2s}
    .day-circle.done{background:var(--cream);color:#4a0a18;border-color:var(--cream)}
    .day-circle.today{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(244,201,93,.12)}

    /* ── Chip ───────────────────────────────────────────────── */
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
      background:rgba(255,255,255,.04);border:1px solid var(--line-s);border-radius:999px;
      color:var(--ink);font-size:12px;cursor:pointer;transition:background .15s;font-family:'Geist',sans-serif;border:none}
    .chip:hover{background:rgba(255,255,255,.08)}
    .chip.active{background:var(--cream);color:#4a0a18}

    /* ── Chat ───────────────────────────────────────────────── */
    .chat-root{display:flex;flex-direction:column;height:100%;max-width:880px;overflow:hidden}
    .chat-header{display:flex;align-items:center;gap:14px;padding:20px 44px 18px;
      border-bottom:1px solid var(--line);flex-shrink:0}
    .chat-messages{flex:1;overflow-y:auto;padding:24px 44px;display:flex;flex-direction:column;gap:14px}
    .chat-footer{padding:14px 44px 20px;border-top:1px solid var(--line);flex-shrink:0}
    .chat-form{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);
      border:1px solid var(--line-s);border-radius:999px;padding:6px 6px 6px 18px}
    .chat-input{flex:1;background:transparent;border:none;color:var(--ink);font-size:14px;
      font-family:'Geist',sans-serif;outline:none;padding:6px 0}
    .chat-input::placeholder{color:var(--ink-f)}
    .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
      color:var(--ink-f);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s}
    .send-btn.active{background:var(--cream);color:#4a0a18}
    .upload-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;
      color:var(--ink-f);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:color .15s}
    .upload-btn:hover{color:var(--ink-m)}
    .pending-images{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 4px}
    .pending-img-wrap{position:relative}
    .pending-img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line-s);display:block}
    .pending-img-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
      background:var(--bg-2);border:1px solid var(--line-s);color:var(--ink);
      display:grid;place-items:center;cursor:pointer;font-size:10px;line-height:1}
    .bubble-img{width:180px;height:180px;object-fit:cover;border-radius:12px;display:block;margin-bottom:6px}
    .bubble-img-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .bubble-row{display:flex;align-items:flex-end;gap:10px}
    .bubble-row.user{flex-direction:row-reverse}
    .bubble{border-radius:18px;padding:13px 17px;line-height:1.55;border:1px solid var(--line-s);font-size:14px}
    .bubble.ai{background:rgba(255,255,255,.04);border-radius:18px 18px 18px 4px}
    .bubble.user{background:var(--cream);color:#4a0a18;border-radius:18px 18px 4px 18px;border-color:var(--cream)}
    .bubble-avatar{width:28px;height:28px;border-radius:50%;background:rgba(244,201,93,.12);
      display:grid;place-items:center;font-size:13px;flex-shrink:0}

    /* ── Input ──────────────────────────────────────────────── */
    .gn-input{width:100%;background:rgba(0,0,0,.20);border:1px solid var(--line-s);border-radius:12px;
      padding:12px 14px;color:var(--ink);font-family:'Geist',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
    .gn-input::placeholder{color:var(--ink-f)}
    .gn-input:focus{border-color:var(--cream-2)}
    textarea.gn-input{resize:vertical;min-height:80px}

    /* ── Fade in ────────────────────────────────────────────── */
    .fade-in{animation:fadeIn .35s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* ── Mobile top bar ─────────────────────────────────────── */
    .mobile-bar{display:none;position:fixed;top:0;left:0;right:0;height:56px;
      background:rgba(42,6,16,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
      align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
    .hamburger{background:none;border:none;color:var(--ink);cursor:pointer;padding:6px;display:flex;align-items:center}
    .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:rgba(42,6,16,.97);
      backdrop-filter:blur(24px);border-right:1px solid var(--line);padding:22px 14px;
      display:flex;flex-direction:column;gap:4px;z-index:300;transform:translateX(-100%);
      transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .drawer.open{transform:translateX(0)}
    .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 22px}
    .close-btn{background:none;border:none;color:var(--ink-m);cursor:pointer;padding:4px}

    /* ── Wishlist badge ─────────────────────────────────────── */
    .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;
      font-weight:600;letter-spacing:.02em}
    .badge-want{background:rgba(244,201,93,.18);color:var(--gold)}
    .badge-bought{background:rgba(125,210,140,.18);color:#7dd28c}

    /* ── Rating stars ───────────────────────────────────────── */
    .stars{display:flex;gap:3px;color:var(--gold);font-size:13px}

    /* ── Responsive ─────────────────────────────────────────── */
    /* ── Voice button ───────────────────────────────────────── */
    .voice-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-s);
      background:rgba(255,255,255,.05);color:var(--ink-m);cursor:pointer;
      display:grid;place-items:center;flex-shrink:0;transition:all .2s}
    .voice-btn:hover{background:rgba(255,255,255,.09);color:var(--ink)}
    .voice-btn.connecting{border-color:var(--gold);color:var(--gold);animation:pulse 1s ease-in-out infinite}
    .voice-btn.listening{border-color:var(--rose);color:var(--rose);background:rgba(255,154,169,.1);animation:pulse .8s ease-in-out infinite}
    .voice-btn.speaking{border-color:var(--cream);color:var(--cream);background:rgba(251,225,214,.1)}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 0 5px transparent}}

    /* ── Config note ────────────────────────────────────────── */
    .config-note{display:flex;align-items:center;gap:10px;padding:10px 14px;
      background:rgba(244,201,93,.07);border:1px solid rgba(244,201,93,.2);
      border-radius:10px;font-size:12px;color:var(--gold);margin-bottom:14px}

    /* ── Typing dots ─────────────────────────────────────────  */
    .typing-dot{width:5px;height:5px;border-radius:50%;background:var(--ink-f);
      animation:dotPulse 1.2s ease-in-out infinite;display:inline-block;margin:0 2px}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes dotPulse{0%,80%,100%{transform:scale(1);opacity:.4}40%{transform:scale(1.4);opacity:1}}

    @media(max-width:768px){
      .sidebar{display:none}
      .mobile-bar{display:flex}
      .main{padding:72px 16px 24px}
      .page-title{font-size:26px!important}
      .grid-top{grid-template-columns:1fr!important}
      .grid-quick{grid-template-columns:1fr 1fr!important}
      .grid-stash{grid-template-columns:repeat(2,1fr)!important}
      .chat-header{padding:14px 16px 12px!important}
      .chat-messages{padding:14px!important}
      .chat-footer{padding:10px 14px 14px!important}
      .main.is-chat{padding:0!important}
      .chat-root{height:calc(100vh - 56px);margin-top:56px}
    }
    @media(max-width:480px){
      .grid-stash{grid-template-columns:1fr!important}
      .grid-quick{grid-template-columns:1fr!important}
    }
  </style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════════════════════════════════════════
   ⚙️  CONFIG — paste your keys here
   Supabase  → https://supabase.com  (free)  → Project Settings → API
   Gemini    → https://aistudio.google.com   → Get API key
══════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const GEMINI_API_KEY    = 'YOUR_GEMINI_API_KEY';
/* ══════════════════════════════════════════════════════════════ */

const CFG = {
  supabase: SUPABASE_URL !== 'YOUR_SUPABASE_URL',
  gemini:   GEMINI_API_KEY !== 'YOUR_GEMINI_API_KEY',
};

// Stable per-browser user ID (no auth yet)
const USER_ID = (() => {
  let id = localStorage.getItem('gn_uid');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('gn_uid', id); }
  return id;
})();

// Supabase client
const sb = CFG.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ── Gemini Flash (text + vision) ─────────────────────────── */
async function geminiAsk(userText, imageDataUrl = null) {
  const parts = [];
  const systemPrompt = 'You are Glow, a warm and knowledgeable personal skin concierge. Keep responses concise (2–4 sentences max). Give practical, specific skincare advice. When analysing photos, describe what you see in the skin or product and give actionable advice.';
  if (userText) parts.push({ text: userText });
  if (imageDataUrl) {
    const [meta, b64] = imageDataUrl.split(',');
    const mimeType = meta.match(/:(.*?);/)[1];
    parts.push({ inline_data: { mime_type: mimeType, data: b64 } });
  }
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction: { parts:[{ text: systemPrompt }] },
        contents: [{ role:'user', parts }],
        generationConfig: { maxOutputTokens: 300 },
      }) }
  );
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text ?? 'Sorry, something went wrong.';
}

/* ── Gemini Live API (real-time voice) ────────────────────── */
class GeminiLive {
  constructor({ onText, onStatus }) {
    this.onText   = onText;
    this.onStatus = onStatus;
    this.ws = null; this.audioCtx = null; this.outputCtx = null;
    this.source = null; this.processor = null; this.stream = null;
  }

  async start() {
    this.onStatus('connecting');
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    } catch(e) {
      this.onStatus('error:mic'); return;
    }
    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${GEMINI_API_KEY}`;
    this.ws = new WebSocket(url);

    this.ws.onopen = () => {
      this.ws.send(JSON.stringify({ setup: {
        model: 'models/gemini-3.1-flash-live-preview',
        generation_config: {
          response_modalities: ['AUDIO','TEXT'],
          speech_config: { voice_config: { prebuilt_voice_config: { voice_name:'Aoede' } } },
        },
        system_instruction: { parts:[{ text:'You are Glow, a warm skin concierge. Be concise, practical, friendly.' }] },
      }}));
    };

    this.ws.onmessage = async (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.setupComplete) { this.onStatus('listening'); this._startCapture(); }
      if (msg.serverContent) {
        const parts = msg.serverContent.modelTurn?.parts ?? [];
        for (const p of parts) {
          if (p.text) this.onText(p.text);
          if (p.inlineData?.data) await this._play(p.inlineData.data);
        }
        if (msg.serverContent.turnComplete) this.onStatus('listening');
      }
    };

    this.ws.onerror = () => { this.onStatus('error:ws'); this.stop(); };
    this.ws.onclose = () => { if (this.ws) this.onStatus('idle'); };
  }

  _startCapture() {
    this.audioCtx = new AudioContext({ sampleRate:16000 });
    this.source = this.audioCtx.createMediaStreamSource(this.stream);
    this.processor = this.audioCtx.createScriptProcessor(4096, 1, 1);
    this.processor.onaudioprocess = (e) => {
      if (this.ws?.readyState !== WebSocket.OPEN) return;
      const f32 = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f32.length);
      for (let i=0; i<f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i]*32768));
      const b64 = btoa(String.fromCharCode(...new Uint8Array(i16.buffer)));
      this.ws.send(JSON.stringify({ realtime_input:{ media_chunks:[{ mime_type:'audio/pcm;rate=16000', data:b64 }] } }));
    };
    this.source.connect(this.processor);
    this.processor.connect(this.audioCtx.destination);
  }

  async _play(b64) {
    this.onStatus('speaking');
    if (!this.outputCtx) this.outputCtx = new AudioContext({ sampleRate:24000 });
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const i16 = new Int16Array(bytes.buffer);
    const f32 = new Float32Array(i16.length);
    for (let i=0; i<i16.length; i++) f32[i] = i16[i]/32768;
    const buf = this.outputCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);
    const src = this.outputCtx.createBufferSource();
    src.buffer = buf; src.connect(this.outputCtx.destination); src.start();
    await new Promise(r => src.onended = r);
    this.onStatus('listening');
  }

  stop() {
    this.ws?.close(); this.ws = null;
    this.processor?.disconnect(); this.source?.disconnect();
    this.audioCtx?.close(); this.outputCtx?.close();
    this.stream?.getTracks().forEach(t => t.stop());
    this.onStatus('idle');
  }
}

/* ── Data — starts empty, user builds their own ───────────── */

        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>

function StreakCard() {
  const streakCount = 4;
  const streakDays  = [true, true, true, true, false, false, false];
  const todayIdx = new Date().getDay(); // 0=Sun
  const dayOrder = [1,2,3,4,5,6,0];
  return (
    <div className="card" style={{ padding:22 }}>
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:16 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom:4 }}>STREAK</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
            <span className="serif" style={{ fontSize:38, fontWeight:600, lineHeight:1 }}>{streakCount}</span>
            <span style={{ fontSize:13, color:'var(--ink-m)' }}>day{streakCount!==1?'s':''}</span>
          </div>
        </div>
        <div style={{ fontSize:28 }}>🔥</div>
      </div>
      <div style={{ display:'flex', gap:6 }}>
        {dayOrder.map((dayOfWeek, i) => {
          const diff = (todayIdx - dayOfWeek + 7) % 7;
          const done = streakDays[diff] ?? false;
          const isToday = dayOfWeek === todayIdx;
          return (
            <div key={i} className={`day-circle ${done?'done':''} ${isToday&&!done?'today':''}`}>
              {DAYS[i]}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop:14, fontSize:12, color:'var(--ink-m)' }}>
        {streakCount > 0 ? `${streakCount} days in a row — keep it going!` : 'Start your streak today.'}
      </div>
    </div>
  );
}

function ChatPage() {
  const [messages, setMessages] = useState([
    { role:'ai', text:"Hi! I'm Glow, your skin concierge ✨ Ask me anything, or upload a photo of your skin or a product and I'll analyse it for you." }
  ]);
  const [input, setInput]               = useState('');
  const [pendingImages, setPendingImages] = useState([]);
  const [loading, setLoading]           = useState(false);
  const [voiceStatus, setVoiceStatus]   = useState('idle'); // idle|connecting|listening|speaking|error:*
  const messagesEndRef = useRef(null);
  const fileInputRef   = useRef(null);
  const liveRef        = useRef(null);
  const voiceTranscriptRef = useRef('');

  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  // ── File upload ─────────────────────────────────────────────
  const handleFileChange = (e) => {
    Array.from(e.target.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => setPendingImages(imgs => [...imgs, { url:ev.target.result }]);
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };
  const removeImage = (idx) => setPendingImages(imgs => imgs.filter((_,i) => i !== idx));

  // ── Send (text + optional photo → Gemini Flash) ─────────────
  const canSend = (input.trim() || pendingImages.length > 0) && !loading;

  const send = async () => {
    if (!canSend) return;
    const userText = input.trim();
    const imgs     = [...pendingImages];
    setInput(''); setPendingImages([]); setLoading(true);

    setMessages(m => [...m, { role:'user', text:userText, images:imgs }]);
    setMessages(m => [...m, { role:'ai', typing:true }]);

    try {
      let reply;
      if (CFG.gemini) {
        reply = await geminiAsk(
          userText || 'Please analyse this image.',
          imgs[0]?.url ?? null
        );
      } else {
        await new Promise(r => setTimeout(r, 800));
        reply = imgs.length
          ? "Looking at your photo — your skin looks like it could use some extra hydration around the cheeks. Add a ceramide moisturiser after your serum. (Configure GEMINI_API_KEY for real AI analysis ✨)"
          : "I'd love to help! Add your GEMINI_API_KEY in the config section at the top of app.html to enable real AI responses. ✨";
      }
      setMessages(m => m.filter(x => !x.typing).concat({ role:'ai', text:reply }));
    } catch(e) {
      setMessages(m => m.filter(x => !x.typing).concat({ role:'ai', text:`Sorry, something went wrong: ${e.message}` }));
    } finally {
      setLoading(false);
    }
  };

  // ── Voice (Gemini Live API) ──────────────────────────────────
  const voiceActive = voiceStatus !== 'idle' && !voiceStatus.startsWith('error');

  const toggleVoice = async () => {
    if (voiceActive) {
      liveRef.current?.stop(); liveRef.current = null;
      if (voiceTranscriptRef.current.trim()) {
        setMessages(m => [...m, { role:'ai', text: voiceTranscriptRef.current.trim() }]);
        voiceTranscriptRef.current = '';
      }
      return;
    }
    if (!CFG.gemini) {
      setMessages(m => [...m, { role:'ai', text:'Add your GEMINI_API_KEY to enable voice mode 🎙️' }]);
      return;
    }
    voiceTranscriptRef.current = '';
    liveRef.current = new GeminiLive({
      onStatus: setVoiceStatus,
      onText: (t) => {
        voiceTranscriptRef.current += t;
        setMessages(m => {
          const last = m[m.length-1];
          if (last?.role === 'ai' && last.voice) return [...m.slice(0,-1), { role:'ai', text: voiceTranscriptRef.current, voice:true }];
          return [...m, { role:'ai', text: voiceTranscriptRef.current, voice:true }];
        });
      },
    });
    await liveRef.current.start();
  };

  const voiceLabel = { idle:'Voice', connecting:'Connecting…', listening:'Listening…', speaking:'Speaking…', 'error:mic':'Mic denied', 'error:ws':'Connection error' };
  const voiceColor = { listening:'var(--rose)', speaking:'var(--cream)', connecting:'var(--gold)' };

  return (
    <div className="chat-root">
      {/* Header */}
      <div className="chat-header">
        <div style={{ width:44, height:44, borderRadius:'50%', background:'rgba(244,201,93,.12)', border:'1px solid rgba(244,201,93,.28)', display:'grid', placeItems:'center', fontSize:20, flexShrink:0 }}>✨</div>
        <div>
          <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Skin Concierge</div>
          <div style={{ fontSize:12, color:'var(--ink-m)', marginTop:1 }}>
            {CFG.gemini ? 'Powered by Gemini · Your personal skin advisor' : 'Demo mode — add Gemini API key for live AI'}
          </div>
        </div>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          {voiceActive && (
            <div style={{ fontFamily:"'Geist Mono',monospace", fontSize:11, color: voiceColor[voiceStatus] ?? 'var(--ink-f)', display:'flex', alignItems:'center', gap:5 }}>
              <div style={{ width:6, height:6, borderRadius:'50%', background:'currentColor', animation:'pulse .8s infinite' }} />
              {voiceLabel[voiceStatus]}
            </div>
          )}
          <div style={{ fontFamily:"'Geist Mono',monospace", fontSize:11, color:'var(--ink-f)', display:'flex', alignItems:'center', gap:5 }}>
            <div style={{ width:6, height:6, borderRadius:'50%', background:'#7ad888' }} /> ONLINE
          </div>
        </div>
      </div>

      {/* Messages */}
      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i} className={`bubble-row ${m.role}`}>
            {m.role === 'ai' && (
              <div className="bubble-avatar" style={{ background: m.voice ? 'rgba(255,154,169,.12)' : undefined }}>
                {m.voice ? '🎙️' : '✨'}
              </div>
            )}
            <div className={`bubble ${m.role}`} style={{ maxWidth:'72%' }}>
              {m.images?.length > 0 && (
                <div className="bubble-img-grid">
                  {m.images.map((img, j) => <img key={j} src={img.url} className="bubble-img" alt="uploaded" />)}
                </div>
              )}
              {m.typing
                ? <span style={{ display:'flex', alignItems:'center', gap:4, color:'var(--ink-m)', fontStyle:'italic', fontSize:13 }}>
                    Thinking<span className="typing-dot"/><span className="typing-dot"/><span className="typing-dot"/>
                  </span>
                : m.text && <div style={{ whiteSpace:'pre-wrap' }}>{m.text}</div>}
            </div>
          </div>
        ))}
        <div ref={messagesEndRef} />
      </div>

      {/* Footer */}
      <div className="chat-footer">
        {pendingImages.length > 0 && (
          <div className="pending-images" style={{ marginBottom:8 }}>
            {pendingImages.map((img, i) => (
              <div key={i} className="pending-img-wrap">
                <img src={img.url} className="pending-img" alt="pending" />
                <button className="pending-img-remove" onClick={() => removeImage(i)}>✕</button>
              </div>
            ))}
          </div>
        )}

        <div className="chat-form">
          <input ref={fileInputRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={handleFileChange} />

          {/* Camera */}
          <button className="upload-btn" onClick={() => fileInputRef.current?.click()} title="Upload photo for AI analysis">
            <CameraIcon />
          </button>

          <input className="chat-input"
            placeholder={voiceActive ? 'Voice mode active — speak to Glow…' : 'Ask about your skin, routine, or products…'}
            value={input} disabled={voiceActive}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key==='Enter' && !e.shiftKey && (e.preventDefault(), send())} />

          {/* Voice button */}
          <button
            className={`voice-btn ${voiceStatus}`}
            onClick={toggleVoice}
            title={voiceActive ? 'Stop voice' : 'Start voice chat'}
          >
            {voiceActive ? <StopIcon /> : <MicIcon />}
          </button>

          {/* Send */}
          <button className={`send-btn ${canSend?'active':''}`} onClick={send} disabled={loading}>
            <SendIcon />
          </button>
        </div>

        <div style={{ fontFamily:"'Geist Mono',monospace", fontSize:9, letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--ink-f)', textAlign:'center', marginTop:8 }}>
          POWERED BY GEMINI
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ROUTINES PAGE
══════════════════════════════════════════════════════════════ */
function RoutinesPage() {
  const [type, setType] = useState('morning');
  const [completed, setCompleted] = useState({});

  const toggle = (id) => setCompleted(c => ({ ...c, [id]: !c[id] }));
  const doneCount = MOCK_ROUTINE.filter(s => completed[s.id]).length;

  return (
    <div className="fade-in" style={{ maxWidth:720 }}>
      <h1 className="serif page-title" style={{ fontSize:38, fontWeight:600, letterSpacing:'-0.02em' }}>My Routines</h1>
      <p style={{ color:'var(--ink-m)', marginTop:8, marginBottom:22, fontSize:14 }}>
        Track your daily steps. Tap to check off as you go.
      </p>

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:22, flexWrap:'wrap', gap:10 }}>
        <div className="tabs">
          <button className={`tab ${type==='morning'?'active':''}`} onClick={() => { setType('morning'); setCompleted({}); }}>☀️ Morning</button>
          <button className={`tab ${type==='evening'?'active':''}`} onClick={() => { setType('evening'); setCompleted({}); }}>🌙 Evening</button>
        </div>
        <div style={{ fontSize:12, color:'var(--ink-m)' }}>{doneCount} / {MOCK_ROUTINE.length} done</div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        {MOCK_ROUTINE.map((step, i) => {
          const done = !!completed[step.id];
          return (
            <div key={step.id} className={`step-row ${done?'done':''}`} style={{ animationDelay:`${i*0.05}s` }}>
              <button className={`step-check ${done?'checked':''}`} onClick={() => toggle(step.id)}>
                {done && <CheckIcon />}
              </button>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="step-name" style={{ fontWeight:600, fontSize:14 }}>{step.name}</div>
                <div style={{ fontSize:12, color:'var(--ink-m)', marginTop:2 }}>{step.desc}</div>
              </div>
              <div style={{ fontFamily:"'Geist Mono',monospace", fontSize:11, color:'var(--ink-f)', flexShrink:0 }}>{step.duration}</div>
            </div>
          );
        })}
      </div>

      {doneCount === MOCK_ROUTINE.length && (
        <div className="card" style={{ padding:20, marginTop:20, textAlign:'center' }}>
          <div style={{ fontSize:28, marginBottom:8 }}>🎉</div>
          <div className="serif" style={{ fontSize:17, fontWeight:600 }}>Routine complete!</div>
          <div style={{ fontSize:13, color:'var(--ink-m)', marginTop:4 }}>Your skin will thank you.</div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   STASH PAGE — Supabase backed
══════════════════════════════════════════════════════════════ */
const SWATCH_COLORS = ['#b5d4e0','#c8dbb5','#e0c9a6','#d9bfce','#c4a8c0','#b5c8e0','#e0b5c8','#c8e0b5'];

function StashPage() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ name:'', brand:'', category:'', rating:5, review:'' });

  // Load from Supabase or localStorage
  useEffect(() => {
    const load = async () => {
      if (sb) {
        const { data } = await sb.from('products').select('*').eq('user_id', USER_ID).order('created_at', { ascending:false });
        setProducts(data ?? []);
      } else {
        setProducts(JSON.parse(localStorage.getItem('gn_products') || '[]'));
      }
      setLoading(false);
    };
    load();
  }, []);

  const save = (list) => {
    setProducts(list);
    if (!sb) localStorage.setItem('gn_products', JSON.stringify(list));
  };

  const add = async () => {
    if (!form.name.trim()) return;
    const color = SWATCH_COLORS[Math.floor(Math.random()*SWATCH_COLORS.length)];
    if (sb) {
      const { data } = await sb.from('products').insert([{ ...form, user_id:USER_ID, color }]).select().single();
      if (data) setProducts(p => [data, ...p]);
    } else {
      save([{ ...form, id:Date.now().toString(), color, created_at:new Date().toISOString() }, ...products]);
    }
    setForm({ name:'', brand:'', category:'', rating:5, review:'' });
    setShowModal(false);
  };

  const del = async (id) => {
    if (sb) await sb.from('products').delete().eq('id', id).eq('user_id', USER_ID);
    save(products.filter(x => x.id !== id));
  };

  return (
    <div className="fade-in" style={{ maxWidth:1000 }}>
      {!CFG.supabase && (
        <div className="config-note">⚙️ Using local storage — add SUPABASE_URL + SUPABASE_ANON_KEY to sync across devices</div>
      )}
      <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:22, flexWrap:'wrap', gap:10 }}>
        <div>
          <h1 className="serif page-title" style={{ fontSize:38, fontWeight:600, letterSpacing:'-0.02em' }}>My Stash</h1>
          <p style={{ color:'var(--ink-m)', marginTop:6, fontSize:14 }}>{products.length} product{products.length!==1?'s':''} tracked</p>
        </div>
        <button className="btn-cream" onClick={() => setShowModal(true)}>
          <PlusIcon /> Add Product
        </button>
      </div>

      {loading ? (
        <div style={{ textAlign:'center', padding:60, color:'var(--ink-f)' }}>Loading…</div>
      ) : products.length === 0 ? (
        <div className="card" style={{ textAlign:'center', padding:'60px 24px' }}>
          <div style={{ fontSize:13, color:'var(--ink-f)' }}>No products yet. Add your first one!</div>
        </div>
      ) : (
        <div className="grid-stash" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16 }}>
          {products.map(p => (
            <div key={p.id} className="product-card">
              <div className="product-swatch" style={{ background:`linear-gradient(135deg, ${p.color}33, ${p.color}66)` }}>
                <div style={{ position:'absolute', top:10, right:10 }}>
                  <button onClick={() => del(p.id)} style={{ background:'rgba(0,0,0,.4)', border:'none', borderRadius:'50%', width:24, height:24, display:'grid', placeItems:'center', cursor:'pointer', color:'rgba(255,255,255,.7)', fontSize:12 }}>✕</button>
                </div>
              </div>
              {p.brand && <div className="eyebrow" style={{ fontSize:9 }}>{p.brand}</div>}
              <div className="serif" style={{ fontSize:15, fontWeight:600, lineHeight:1.2 }}>{p.name}</div>
              {p.rating > 0 && (
                <div className="stars">{'★'.repeat(p.rating)}{'☆'.repeat(5-p.rating)}</div>
              )}
              {p.review && <div style={{ fontSize:12, color:'var(--ink-m)', lineHeight:1.4 }}>{p.review}</div>}
            </div>
          ))}
        </div>
      )}

      {/* Modal */}
      {showModal && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.65)', backdropFilter:'blur(8px)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:500, padding:24 }}
          onClick={e => e.target === e.currentTarget && setShowModal(false)}>
          <div style={{
            width:'100%', maxWidth:440, padding:28,
            background:'linear-gradient(160deg, #3d0a16 0%, #2e0810 100%)',
            border:'1px solid var(--line-s)', borderRadius:24,
            boxShadow:'0 32px 80px -16px rgba(0,0,0,.8)',
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
              <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Add Product</div>
              <button onClick={() => setShowModal(false)} style={{ background:'rgba(255,255,255,.07)', border:'1px solid var(--line)', borderRadius:'50%', width:30, height:30, display:'grid', placeItems:'center', color:'var(--ink-m)', cursor:'pointer', fontSize:14 }}>✕</button>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              <input className="gn-input" placeholder="Product name *" value={form.name} onChange={e => setForm(f => ({...f, name:e.target.value}))} />
              <input className="gn-input" placeholder="Brand" value={form.brand} onChange={e => setForm(f => ({...f, brand:e.target.value}))} />
              <input className="gn-input" placeholder="Category (e.g. Serum, Moisturiser)" value={form.category} onChange={e => setForm(f => ({...f, category:e.target.value}))} />
              <textarea className="gn-input" placeholder="Your review…" value={form.review} onChange={e => setForm(f => ({...f, review:e.target.value}))} />
              <div>
                <div style={{ fontSize:11, color:'var(--ink-m)', marginBottom:8, letterSpacing:'0.18em', textTransform:'uppercase', fontFamily:"'Geist Mono',monospace" }}>RATING</div>
                <div style={{ display:'flex', gap:6 }}>
                  {[1,2,3,4,5].map(n => (
                    <button key={n} onClick={() => setForm(f => ({...f, rating:n}))}
                      style={{ background:'none', border:'none', cursor:'pointer', fontSize:24, color: n <= form.rating ? 'var(--gold)' : 'rgba(255,255,255,.15)', transition:'color .15s' }}>★</button>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ display:'flex', gap:10, marginTop:22 }}>
              <button className="btn-ghost" style={{ flex:1, justifyContent:'center' }} onClick={() => setShowModal(false)}>Cancel</button>
              <button className="btn-cream" style={{ flex:1, justifyContent:'center' }} onClick={add}>Add to Stash</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   WISHLIST PAGE — Supabase backed
══════════════════════════════════════════════════════════════ */
function WishlistPage() {
  const [items, setItems]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [form, setForm]         = useState({ name:'', brand:'', notes:'' });

  useEffect(() => {
    const load = async () => {
      if (sb) {
        const { data } = await sb.from('wishlist').select('*').eq('user_id', USER_ID).order('created_at', { ascending:false });
        setItems(data ?? []);
      } else {
        setItems(JSON.parse(localStorage.getItem('gn_wishlist') || '[]'));
      }
      setLoading(false);
    };
    load();
  }, []);

  const save = (list) => {
    setItems(list);
    if (!sb) localStorage.setItem('gn_wishlist', JSON.stringify(list));
  };

  const add = async () => {
    if (!form.name.trim()) return;
    if (sb) {
      const { data } = await sb.from('wishlist').insert([{ ...form, user_id:USER_ID, status:'want' }]).select().single();
      if (data) setItems(i => [data, ...i]);
    } else {
      save([{ ...form, id:Date.now().toString(), status:'want', created_at:new Date().toISOString() }, ...items]);
    }
    setForm({ name:'', brand:'', notes:'' });
    setShowModal(false);
  };

  const toggleBought = async (id) => {
    const item  = items.find(x => x.id===id);
    const next  = item.status==='want' ? 'bought' : 'want';
    if (sb) await sb.from('wishlist').update({ status:next }).eq('id', id).eq('user_id', USER_ID);
    save(items.map(x => x.id===id ? {...x, status:next} : x));
  };

  const del = async (id) => {
    if (sb) await sb.from('wishlist').delete().eq('id', id).eq('user_id', USER_ID);
    save(items.filter(x => x.id !== id));
  };

  const want   = items.filter(x => x.status==='want');
  const bought = items.filter(x => x.status==='bought');

  return (
    <div className="fade-in" style={{ maxWidth:760 }}>
      {!CFG.supabase && (
        <div className="config-note">⚙️ Using local storage — add SUPABASE_URL + SUPABASE_ANON_KEY to sync across devices</div>
      )}
      <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:22, flexWrap:'wrap', gap:10 }}>
        <div>
          <h1 className="serif page-title" style={{ fontSize:38, fontWeight:600, letterSpacing:'-0.02em' }}>Wishlist</h1>
          <p style={{ color:'var(--ink-m)', marginTop:6, fontSize:14 }}>{want.length} to try · {bought.length} bought</p>
        </div>
        <button className="btn-cream" onClick={() => setShowModal(true)}>
          <PlusIcon /> Add Item
        </button>
      </div>

      {[{ label:'WANT TO TRY', data:want }, { label:'BOUGHT', data:bought }].map(({ label, data }) => data.length > 0 && (
        <div key={label} style={{ marginBottom:28 }}>
          <div className="eyebrow" style={{ marginBottom:12 }}>{label}</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {data.map(item => (
              <div key={item.id} className="card-flat" style={{ padding:'14px 18px', display:'flex', alignItems:'center', gap:14 }}>
                <button onClick={() => toggleBought(item.id)}
                  className={`step-check ${item.status==='bought'?'checked':''}`}>
                  {item.status==='bought' && <CheckIcon />}
                </button>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:14, textDecoration:item.status==='bought'?'line-through':'none', color:item.status==='bought'?'var(--ink-m)':'var(--ink)' }}>{item.name}</div>
                  {item.brand && <div style={{ fontSize:12, color:'var(--ink-m)', marginTop:1 }}>{item.brand}</div>}
                  {item.notes && <div style={{ fontSize:12, color:'var(--ink-f)', marginTop:2 }}>{item.notes}</div>}
                </div>
                <span className={`badge ${item.status==='want'?'badge-want':'badge-bought'}`}>
                  {item.status==='want'?'Want':'Bought'}
                </span>
                <button onClick={() => del(item.id)} style={{ background:'none', border:'none', color:'var(--ink-f)', cursor:'pointer', fontSize:16, padding:4 }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      ))}

      {loading ? (
        <div style={{ textAlign:'center', padding:60, color:'var(--ink-f)' }}>Loading…</div>
      ) : items.length === 0 && (
        <div className="card" style={{ textAlign:'center', padding:'60px 24px' }}>
          <div style={{ fontSize:13, color:'var(--ink-f)' }}>Your wishlist is empty. Add something to try!</div>
        </div>
      )}

      {showModal && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.65)', backdropFilter:'blur(8px)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:500, padding:24 }}
          onClick={e => e.target === e.currentTarget && setShowModal(false)}>
          <div style={{
            width:'100%', maxWidth:400, padding:28,
            background:'linear-gradient(160deg, #3d0a16 0%, #2e0810 100%)',
            border:'1px solid var(--line-s)', borderRadius:24,
            boxShadow:'0 32px 80px -16px rgba(0,0,0,.8)',
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
              <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Add to Wishlist</div>
              <button onClick={() => setShowModal(false)} style={{ background:'rgba(255,255,255,.07)', border:'1px solid var(--line)', borderRadius:'50%', width:30, height:30, display:'grid', placeItems:'center', color:'var(--ink-m)', cursor:'pointer', fontSize:14 }}>✕</button>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              <input className="gn-input" placeholder="Product name *" value={form.name} onChange={e => setForm(f => ({...f, name:e.target.value}))} />
              <input className="gn-input" placeholder="Brand" value={form.brand} onChange={e => setForm(f => ({...f, brand:e.target.value}))} />
              <input className="gn-input" placeholder="Notes (optional)" value={form.notes} onChange={e => setForm(f => ({...f, notes:e.target.value}))} />
            </div>
            <div style={{ display:'flex', gap:10, marginTop:22 }}>
              <button className="btn-ghost" style={{ flex:1, justifyContent:'center' }} onClick={() => setShowModal(false)}>Cancel</button>
              <button className="btn-cream" style={{ flex:1, justifyContent:'center' }} onClick={add}>Add Item</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PROFILE PAGE
══════════════════════════════════════════════════════════════ */
function ProfilePage() {
  const [skinType, setSkinType] = useState('Combination');
  const [concerns, setConcerns] = useState(['Hydration', 'Redness']);
  const CONCERNS = ['Hydration','Acne','Redness','Anti-aging','Brightening','Sensitivity','Oiliness','Texture'];

  const toggleConcern = (c) => setConcerns(cs => cs.includes(c) ? cs.filter(x => x!==c) : [...cs, c]);

  return (
    <div className="fade-in" style={{ maxWidth:640 }}>
      <div style={{ marginBottom:28 }}>
        <h1 className="serif page-title" style={{ fontSize:38, fontWeight:600, letterSpacing:'-0.02em' }}>Profile</h1>
      </div>

      {/* Avatar */}
      <div className="card" style={{ padding:24, display:'flex', alignItems:'center', gap:18, marginBottom:18 }}>
        <div style={{ width:68, height:68, borderRadius:'50%', background:'linear-gradient(135deg, var(--bg-3), var(--plum))', display:'grid', placeItems:'center', fontSize:28, flexShrink:0, border:'2px solid var(--line-s)' }}>
          🌸
        </div>
        <div>
          <div className="serif" style={{ fontSize:22, fontWeight:600 }}>Nicole</div>
          <div style={{ fontSize:13, color:'var(--ink-m)', marginTop:2 }}>nicole@example.com</div>
        </div>
      </div>

      {/* Skin type */}
      <div className="card" style={{ padding:22, marginBottom:18 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>SKIN TYPE</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
          {SKIN_TYPES.map(t => (
            <button key={t} className={`chip ${skinType===t?'active':''}`} onClick={() => setSkinType(t)}
              style={{ border: skinType===t ? 'none' : '1px solid var(--line-s)', cursor:'pointer' }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      {/* Concerns */}
      <div className="card" style={{ padding:22, marginBottom:18 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>SKIN CONCERNS</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
          {CONCERNS.map(c => (
            <button key={c} className={`chip ${concerns.includes(c)?'active':''}`} onClick={() => toggleConcern(c)}
              style={{ border: concerns.includes(c) ? 'none' : '1px solid var(--line-s)', cursor:'pointer' }}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {/* Stats */}
      <div className="card" style={{ padding:22 }}>
        <div className="eyebrow" style={{ marginBottom:14 }}>YOUR STATS</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
          {[
            { label:'Products', value: 0 },
            { label:'Wishlist',  value: 0 },
            { label:'Day Streak', value: '0 🌱' },
          ].map(({ label, value }) => (
            <div key={label} style={{ textAlign:'center', padding:'14px 8px', background:'rgba(255,255,255,.03)', borderRadius:12, border:'1px solid var(--line)' }}>
              <div className="serif" style={{ fontSize:26, fontWeight:600, lineHeight:1 }}>{value}</div>
              <div style={{ fontSize:11, color:'var(--ink-m)', marginTop:4 }}>{label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState('home');

  const content = {
    home:     <HomePage setPage={setPage} />,
    chat:     <ChatPage />,
    routines: <RoutinesPage />,
    stash:    <StashPage />,
    wishlist: <WishlistPage />,
    profile:  <ProfilePage />,
  };

  return (
    <Shell page={page} setPage={setPage}>
      {content[page]}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
